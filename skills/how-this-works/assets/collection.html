<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How This Works · 项目库</title><style>
:root{font:15px/1.8 system-ui,-apple-system,"PingFang SC",sans-serif;color:#263e35;background:#f6f8f4;--green:#28634f;--line:#dce5da}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,summary{cursor:pointer}a{color:var(--green);overflow-wrap:anywhere}button{border:1px solid var(--line);border-radius:7px;background:white;color:inherit;padding:7px 12px;text-align:left}button:hover{border-color:var(--green)}button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c28a37;outline-offset:3px}header{height:70px;padding:18px 28px;background:white;border-bottom:1px solid var(--line);font-size:21px;font-weight:650}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1600px;margin:auto}nav{padding:20px 15px;border-right:1px solid var(--line);position:sticky;top:0;max-height:100vh;overflow:auto}nav button{display:block;width:100%;margin:5px 0;border-color:transparent;background:transparent}nav button.active{background:var(--green);color:white}summary{padding:8px 10px;font-weight:600}nav .child{padding-left:25px;font-size:13px}main{padding:35px 42px 80px;min-width:0}h1{font-size:30px;line-height:1.5;margin:8px 0 15px}h2{font-size:22px;margin:27px 0 13px}h3{font-size:17px;margin:5px 0 9px}p{margin:10px 0 16px}.muted,small{color:#63776c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}.card p{font-size:14px}.badge{display:inline-block;background:#eaf1e7;color:var(--green);padding:2px 8px;border-radius:5px;font-size:12px;margin:3px}.notice{border-left:3px solid #b09360;background:#f2eee2;padding:13px 17px;font-size:14px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}select{background:white;border:1px solid var(--line);border-radius:6px;padding:6px;max-width:100%}.timeline{border-left:2px solid #b9ccbb;margin-left:8px;padding-left:23px}.event{padding:0 0 22px}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3eb;padding:14px;font:12px/1.7 ui-monospace,monospace;max-height:350px;overflow:auto}details{margin:7px 0}.heat-wrap{overflow:auto;margin:18px 0}.heat{display:grid;gap:4px;min-width:820px;align-items:center}.heat button{padding:5px;font-size:11px;text-align:center;border-radius:4px}.heat small{font-size:10px;writing-mode:vertical-rl;height:55px;justify-self:center}.heat .row{text-align:left;font-size:12px;background:white}.count{float:right;color:#63776c}.crumb button{border:0;background:none;padding:0;color:var(--green);text-decoration:underline}footer{font-size:12px;color:#63776c;margin-top:30px}@media(max-width:800px){.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:24px}.split{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}nav{position:static;max-height:270px;border-bottom:1px solid var(--line)}main{padding:22px 17px}h1{font-size:26px}}

.trend{margin:18px 0;padding:18px;background:white;border:1px solid var(--line);border-radius:10px}.trend .controls{margin:0 0 10px}.trend-scroll{overflow-x:auto}.trend svg{display:block;width:100%;min-width:520px;height:auto}.trend text{font:12px system-ui;fill:#63776c}.trend-hit{cursor:crosshair;outline:none}.trend-hit .guide,.trend-hit .dot{opacity:0;pointer-events:none}.trend-hit:hover .guide,.trend-hit:focus .guide,.trend-hit:hover .dot,.trend-hit:focus .dot{opacity:1}.trend-readout{min-height:3.6em;font-size:14px;color:var(--green);font-variant-numeric:tabular-nums}.trend-hit:focus .guide{stroke:#b78032}
</style></head><body><header id="title"></header><div class="layout"><nav id="nav" aria-label="领域与子领域"></nav><main id="main"></main></div><script type="application/json" id="data">__COLLECTION__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),P=D.projects,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>{try{return ['http:','https:'].includes(new URL(u,location.href).protocol)?esc(u):'#';}catch{return '#';}};
let S={domain:'',direction:'',project:'',batch:'',metric:''},fold={};try{fold=JSON.parse(localStorage.getItem('htw-collection-fold')||'{}');}catch{}
const dirs=()=>D.directions.filter(x=>!S.domain||x.domain===S.domain),projects=()=>Object.entries(P).filter(([id,p])=>(!S.domain||(p.domain||'unclassified')===S.domain)&&(!S.direction||p.direction===S.direction)&&(!S.batch||D.batches[S.batch]?.selected.some(e=>e.identity===id)));
const bselect=()=>`<div class="controls"><label for="batch">收录批次</label><select id="batch"><option value="">全部保留项目</option>${Object.values(D.batches).map(b=>`<option value="${esc(b.id)}" ${S.batch===b.id?'selected':''}>${esc(b.period)} · ${esc(b.basis)} · Top ${b.top}</option>`).join('')}</select></div>`;
function nav(){const domains=[...D.domains];if(Object.values(P).some(p=>!p.domain))domains.push({id:'unclassified',label:'待分类'});$('#nav').innerHTML=`<button data-home class="${!S.domain&&!S.project?'active':''}">全部项目 <span class="count">${Object.keys(P).length}</span></button>${domains.map(d=>`<details data-fold="${esc(d.id)}" ${fold[d.id]===false?'':'open'}><summary>${esc(d.label)} <span class="count">${Object.values(P).filter(p=>(p.domain||'unclassified')===d.id).length}</span></summary><button data-domain="${esc(d.id)}" class="${S.domain===d.id&&!S.direction&&!S.project?'active':''}">领域总览</button>${D.directions.filter(x=>x.domain===d.id).map(x=>`<button class="child ${S.direction===x.id&&!S.project?'active':''}" data-direction="${esc(x.id)}">${esc(x.label)} <span class="count">${Object.values(P).filter(p=>p.direction===x.id).length}</span></button>`).join('')}</details>`).join('')}`;}
function eventTimeline(events=[]){return `<div class="timeline">${events.map(e=>`<article class="event"><small>${esc(e.date||e.period||'日期待核对')} · ${esc(e.repo||e.kind||'版本变化')}</small><h3>${esc(e.title||e.summary)}</h3><p>${esc(e.summary||e.text||'')}</p>${e.before||e.after?`<div class="split"><div class="card"><b>之前</b><p>${esc(e.before)}</p></div><div class="card"><b>之后</b><p>${esc(e.after)}</p></div></div>`:''}${e.tradeoff?`<p>${esc(e.tradeoff)}</p>`:''}${e.url?`<a href="${url(e.url)}" target="_blank" rel="noopener">核对来源 ↗</a>`:''}${(e.claims||[]).map(c=>`<details><summary>${esc(c.level)} · ${esc(c.text)}</summary>${(c.evidence||[]).map(v=>`<p><a href="${url(v.url||'#')}" target="_blank" rel="noopener">${esc(v.path)}:${v.start_line} · ${esc(v.commit?.slice(0,10))}</a></p>${v.text?`<pre>${esc(v.text)}</pre>`:''}`).join('')}</details>`).join('')}</article>`).join('')}</div>`;}
function overview(){const section=D.directions.find(d=>d.id===S.direction)||D.domains.find(d=>d.id===S.domain),list=projects(),batch=D.batches[S.batch];return `<h1>${esc(section?.label||'项目库')}</h1>${section?.text?`<p>${esc(section.text)}</p>`:'<p>从领域进入方向，再查看具体项目的方案与版本。旧项目和旧研究会保留，不因当期未入榜而消失。</p>'}${bselect()}${attention()}${batch?`<div class="notice">${esc(batch.basis)} · ${esc(batch.source)} · 观察于 ${esc(batch.observedAt)}。当前批次 ${batch.selected.filter(e=>e.status==='done').length}/${batch.selected.length} 项已处理。只有已交付项目出现在下方；入选不等于研究完成。</div>`:''}${!S.direction?`<div class="grid">${dirs().map(d=>`<article class="card"><h3>${esc(d.label)}</h3><p>${esc(d.text||'')}</p><button data-direction="${esc(d.id)}">进入方向 →</button></article>`).join('')}</div>`:''}${section?.milestones?.length?`<h2>方案沿时间怎样变化</h2>${eventTimeline(section.milestones)}`:''}<h2>${list.length} 个已收录项目</h2><div class="grid">${list.map(([id,p])=>{const row=batch?.selected.find(e=>e.identity===id);return `<article class="card"><h3>${esc(p.title||p.repo)}</h3><small>${esc(p.repo)}</small>${p.method?`<p><b>${esc(p.method)}</b></p>`:''}<p>${esc(p.description||'')}</p>${row?`<span class="badge">${esc(row.action)} · ${esc(row.status)}</span>${row.score!==undefined?`<span class="badge">本次指标 ${esc(row.score)}</span>`:''}`:''}<p><button data-project="${esc(id)}">查看方案与版本 →</button></p></article>`}).join('')}</div>`;}
function project(){const p=P[S.project],latest=p.versions.at(-1);return `<div class="crumb"><button data-home>项目库</button> / <button data-domain="${esc(p.domain||'')}">${esc(D.domains.find(d=>d.id===p.domain)?.label||'Unclassified')}</button> / <button data-direction="${esc(p.direction||'')}">${esc(D.directions.find(d=>d.id===p.direction)?.label||'Unclassified')}</button></div><h1>${esc(p.title||p.repo)}</h1><p>${esc(p.description||'')}</p>${p.method?`<span class="badge">${esc(p.method)}</span>`:''}${p.scope?`<div class="notice">${esc(p.scope)}</div>`:''}${attention()}${latest?`<p>解释固定在 <b>${esc(latest.revision.slice(0,12))}</b>；差异已复核至 <b>${esc(p.reviewedRevision?.slice(0,12)||latest.revision.slice(0,12))}</b>。两者不同，表示旧解释仍保留其原始证据版本。</p>`:''}<h2>已有学习版本</h2>${p.versions.map(v=>`<p><span class="badge">${esc(v.revision.slice(0,12))}</span> ${v.url?`<a href="${url(v.url)}" target="_blank" rel="noopener">打开该版本的学习网页 ↗</a>`:'原始网页尚未登记访问地址'}</p>`).join('')}<h2>历次入选与增量研究</h2>${Object.values(D.batches).filter(b=>b.selected.some(e=>e.identity===S.project)).map(b=>{const e=b.selected.find(e=>e.identity===S.project);return `<article class="card"><small>${esc(b.period)} · ${esc(b.basis)}</small><p>${esc(e.summary||(e.action==='reuse'?'上游版本未变，复用既有理解。':'等待完成本次研究。'))}</p><small>${esc(e.baseRevision?.slice(0,10)||'首次')} → ${esc((e.reviewedRevision||e.revision||'待固定').slice(0,10))}</small>${(e.reviewEvidence||[]).map(ref=>`<p><a href="${url(ref)}" target="_blank" rel="noopener">差异依据 ↗</a></p>`).join('')}</article>`}).join('')||'<p class="muted">作为已有项目导入，尚未参加新的收录批次。</p>'}${p.history?.events?.length?`<h2>方案演化</h2>${eventTimeline(p.history.events)}`:''}`;}
let trendData;
function trendPlot(index=0){
 const {series,periods,label}=trendData,row=series[index],vals=row.values;
 const width=900,height=250,left=70,right=42,top=20,bottom=38,max=Math.max(1,...vals.filter(v=>v!==null));
 const x=i=>periods.length===1?(left+width-right)/2:left+i*(width-left-right)/(periods.length-1),y=v=>height-bottom-v/max*(height-top-bottom);
 const format=v=>v.toLocaleString('zh-CN'),tickEvery=Math.max(1,Math.ceil(periods.length/7));
 let path='',connected=false;
 vals.forEach((v,i)=>{if(v===null){connected=false;return;}path+=`${connected?'L':'M'}${x(i)},${y(v)} `;connected=true;});
 return `<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="${esc(row.label)} · ${esc(label)}，按 Tab 查看各月数值">
 ${[0,.25,.5,.75,1].map(f=>`<line x1="${left}" x2="${width-right}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#e6ece4"/><text x="${left-10}" y="${y(max*f)+4}" text-anchor="end">${format(Math.round(max*f))}</text>`).join('')}
 <path d="${path}" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linejoin="round"/>
 ${vals.map((v,i)=>v===null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#28634f"/>`).join('')}
 ${periods.map((m,i)=>(i%tickEvery===0&&i<periods.length-2)||i===periods.length-1?`<text x="${x(i)}" y="${height-10}" text-anchor="middle">${esc(m)}</text>`:'').join('')}
 ${periods.map((m,i)=>{const start=i? (x(i-1)+x(i))/2:left-12,end=i<periods.length-1?(x(i)+x(i+1))/2:width-right+12;
 const readout=`${m} · ${row.label} · ${label}：${vals[i]===null?'缺少完整观测':format(vals[i])}`;
 return `<g class="trend-hit" tabindex="0" role="img" aria-label="${esc(readout)}" data-readout="${esc(readout)}" aria-describedby="trend-readout"><line class="guide" x1="${x(i)}" x2="${x(i)}" y1="${top}" y2="${height-bottom}" stroke="#87a696" stroke-dasharray="4 4"/>${vals[i]===null?'':`<circle class="dot" cx="${x(i)}" cy="${y(vals[i])}" r="6" fill="white" stroke="#28634f" stroke-width="2"/>`}<rect x="${start}" y="${top}" width="${end-start}" height="${height-bottom-top}" fill="transparent"/></g>`;}).join('')}</svg>`;
}
function trend(rows,periods,value,label){
 const ids=[...new Set(rows.flatMap(row=>row.ids))],group={label:`${D.directions.find(d=>d.id===S.direction)?.label||D.domains.find(d=>d.id===S.domain)?.label||'全部已收录项目'} · 项目群合计`,ids};
 const series=(rows.length>1?[group,...rows]:rows).map(row=>({...row,values:periods.map(m=>value(row,m))}));
 if(!series.length)return '';
 trendData={series,periods,label};
 return `<section class="trend" aria-label="月度关注折线图"><div class="controls"><b>月度趋势</b>${series.length>1?`<label>查看 <select id="trend-series">${series.map((row,i)=>`<option value="${i}">${esc(row.label)}</option>`).join('')}</select></label>`:`<span>${esc(series[0].label)}</span>`}</div><div id="trend-plot" class="trend-scroll">${trendPlot()}</div><div id="trend-readout" class="trend-readout" aria-live="polite">将鼠标移到折线上，或用 Tab 选中月份，查看月份与准确数值。</div><small>纵轴：${esc(label)}。缺少观测的月份留空，不按零连接。</small></section>`;
}
function attention(){
 const all=D.observations||[];if(!all.length)return '';
 const names=Object.fromEntries(all.map(o=>[o.metric,o.label]));const metric=names[S.metric]?S.metric:Object.keys(names)[0];
 const observations=all.filter(o=>o.metric===metric),byMonth={};
 for(const o of observations)if(!byMonth[o.period]||o.observedAt>byMonth[o.period].observedAt)byMonth[o.period]=o;
 const observedPeriods=Object.keys(byMonth).sort(),periods=[];
 for(let month=observedPeriods[0];month<=observedPeriods.at(-1);){periods.push(month);const [year,m]=month.split('-').map(Number);month=m===12?`${year+1}-01`:`${year}-${String(m+1).padStart(2,'0')}`;}
 const eligible=Object.entries(P).filter(([id,p])=>!p.repo.startsWith('local/'));
 const rows=S.project?[{label:P[S.project].title||P[S.project].repo,ids:[S.project],attr:''}]:S.direction?eligible.filter(([id,p])=>p.direction===S.direction).map(([id,p])=>({label:p.repo,ids:[id],attr:`data-project="${esc(id)}"`})):S.domain?D.directions.filter(d=>d.domain===S.domain).map(d=>({label:d.label,ids:eligible.filter(([id,p])=>p.direction===d.id).map(([id])=>id),attr:`data-direction="${esc(d.id)}"`})):D.domains.map(d=>({label:d.label,ids:eligible.filter(([id,p])=>p.domain===d.id).map(([id])=>id),attr:`data-domain="${esc(d.id)}"`}));
 function value(row,period){const v=byMonth[period]?.values;return v&&row.ids.length&&row.ids.every(id=>Object.hasOwn(v,id))?row.ids.reduce((sum,id)=>sum+v[id],0):null;}
 return `<h2>沿时间观察关注变化</h2><div class="controls"><label>指标 <select id="metric">${Object.entries(names).map(([id,label])=>`<option value="${esc(id)}" ${id===metric?'selected':''}>${esc(label)}</option>`).join('')}</select></label></div>${trend(rows,periods,value,names[metric])}<div class="heat-wrap"><div class="heat" style="grid-template-columns:175px repeat(${periods.length},minmax(30px,1fr))"><span></span>${periods.map(m=>`<small>${esc(m)}</small>`).join('')}${rows.map(row=>{const vals=periods.map(m=>value(row,m)),max=Math.max(1,...vals.filter(v=>v!==null));return `<button class="row" ${row.attr}>${esc(row.label)}</button>${vals.map((v,i)=>`<button ${row.attr} style="background:${v===null?'#eee':`rgba(40,99,79,${.07+.7*Math.sqrt(Math.max(0,v)/max)})`};color:${v!==null&&v/max>.4?'white':'#263e35'}" title="${esc(periods[i])} · ${v===null?'缺少完整项目群观测':esc(v)}">${v===null?'—':Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v}</button>`).join('')}`;}).join('')}</div></div><p class="muted">各行独立着色，跨行比较数值；k 为千。“—”表示缺少观测，未入榜不算零。按当前分类回看固定项目群，榜单口径不同的指标不合并。</p>${[...new Set(observations.map(o=>o.warning).filter(Boolean))].map(w=>`<div class="notice">${esc(w)}</div>`).join('')}<details><summary>观察来源与各期覆盖</summary>${observedPeriods.map(m=>`<p>${esc(m)} · ${Object.keys(byMonth[m].values).length} 个项目 · ${esc(byMonth[m].source)} · ${esc(byMonth[m].observedAt)}</p>`).join('')}</details>`;
}
function persist(){history.replaceState(null,'','#'+new URLSearchParams(S));}
function render(){nav();$('#title').textContent=D.title;$('#main').innerHTML=(S.project?project():overview())+'<footer>榜单选择、上游版本、研究交付和公开发布分别记录。该页面由 How This Works 固定模板构建。</footer>';persist();}
document.addEventListener('toggle',e=>{if(e.target.dataset.fold&&e.target.isConnected){fold[e.target.dataset.fold]=e.target.open;try{localStorage.setItem('htw-collection-fold',JSON.stringify(fold));}catch{}}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home')){S.domain='';S.direction='';S.project='';}else if(b.hasAttribute('data-domain')){S.domain=b.dataset.domain;S.direction='';S.project='';}else if(b.hasAttribute('data-direction')){S.direction=b.dataset.direction;S.domain=D.directions.find(d=>d.id===S.direction)?.domain||'';S.project='';}else if(b.dataset.project){S.project=b.dataset.project;}else return;render();window.scrollTo(0,0);});
document.addEventListener('pointerover',showTrendValue);
document.addEventListener('focusin',showTrendValue);
function showTrendValue(e){const point=e.target.closest('[data-readout]');if(point)$('#trend-readout').textContent=point.dataset.readout;}
document.addEventListener('change',e=>{if(e.target.id==='trend-series'){$('#trend-plot').innerHTML=trendPlot(Number(e.target.value));$('#trend-readout').textContent='将鼠标移到折线上，或用 Tab 选中月份，查看月份与准确数值。';}if(e.target.id==='batch'){S.batch=e.target.value;render();}if(e.target.id==='metric'){S.metric=e.target.value;render();}});
function restore(){const q=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(S))S[k]=q.get(k)||'';if(!P[S.project])S.project='';if(!D.batches[S.batch])S.batch='';render();}window.addEventListener('hashchange',restore);restore();
</script></body></html>
